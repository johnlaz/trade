<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<meta name="description" content="Trade Arena: a paper-trading game. Same starting cash, same rules, you against your friends and an AI.">
<title>Trade Arena</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Trade Arena">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
<style>
:root{
  --bg:#0b0f14; --bg2:#0f151d; --card:#131b26; --card2:#18222f; --line:#223043; --tx:#e9eff7; --mut:#8c9bb0;
  --acc:#22c06a; --acc-tx:#031a0d; --up:#3ddc97; --dn:#ff6b6b; --warn:#ffb020; --ai:#a78bfa; --r:16px;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;overscroll-behavior-y:none;background:var(--bg);color:var(--tx);font:15px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
body{min-height:100vh;min-height:100dvh;-webkit-font-smoothing:antialiased;-webkit-touch-callout:none}
input,textarea,select{-webkit-user-select:text;user-select:text;-webkit-appearance:none;appearance:none}
@media (max-width:820px){input,select,textarea,.in{font-size:16px!important}}
button,.btn,.icon-btn,.seg button{-webkit-user-select:none;user-select:none;touch-action:manipulation}
.btn,.icon-btn,.seg button,.lrow{transition:transform .12s ease,filter .12s ease}
.btn:active,.icon-btn:active,.seg button:active{transform:scale(.96)}
.logo{width:26px;height:26px;border-radius:7px;vertical-align:-7px;margin-right:9px;box-shadow:0 0 0 1px #ffffff14,0 2px 8px #0006}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.wrap>*{animation:fadeUp .35s ease both}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.wrap{max-width:560px;margin:0 auto;padding:calc(14px + var(--safe-t)) 16px calc(92px + var(--safe-b))}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.brand{font-weight:900;letter-spacing:.14em;font-size:15px}
.brand span{color:var(--acc)}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);font-size:18px}
.hero{padding:26px 4px 10px}
.hero h1{font-size:34px;line-height:1.05;font-weight:900;letter-spacing:-.02em}
.hero h1 em{font-style:normal;color:var(--acc)}
.hero p{color:var(--mut);margin:12px 0 0;max-width:42ch}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:14px;font-weight:700;border:1px solid var(--line);background:var(--card2)}
.btn.primary{background:var(--acc);color:var(--acc-tx);border-color:var(--acc)}
.btn.block{width:100%}
.btn.sm{min-height:36px;padding:0 14px;font-size:13px;border-radius:10px}
.btn.danger{color:var(--dn);border-color:#5a2a2f}
.btn:disabled{opacity:.45;cursor:not-allowed}
.stack{display:grid;gap:10px}
.row{display:flex;align-items:center;gap:10px}
.row.sp{justify-content:space-between}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card+.card,.stack>.card{margin-top:0}
.sec{margin:22px 0 10px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);font-weight:700}
.mut{color:var(--mut)} .small{font-size:12.5px}
.up{color:var(--up)} .dn{color:var(--dn)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;background:var(--card2);border:1px solid var(--line);color:var(--mut)}
.chip.acc{background:rgba(34,192,106,.12);color:var(--acc);border-color:rgba(34,192,106,.3)}
.chip.ai{background:rgba(167,139,250,.14);color:var(--ai);border-color:rgba(167,139,250,.35)}
.chip.warn{background:rgba(255,176,32,.12);color:var(--warn);border-color:rgba(255,176,32,.3)}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.gitem{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;padding:14px 16px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.gitem b{display:block}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.18em;font-weight:800}
label.f{display:block;font-size:12px;color:var(--mut);font-weight:700;margin:14px 0 6px;letter-spacing:.04em}
.in{width:100%;min-height:46px;padding:10px 14px;border-radius:12px;background:var(--bg2);border:1px solid var(--line);outline:none}
.in:focus{border-color:var(--acc)}
textarea.in{min-height:84px;resize:vertical}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{padding:9px 14px;border-radius:10px;background:var(--bg2);border:1px solid var(--line);font-weight:700;font-size:13px;color:var(--mut)}
.seg button.on{background:var(--acc);color:var(--acc-tx);border-color:var(--acc)}
.seg.buy button.on[data-v=buy]{background:var(--up);border-color:var(--up);color:#04170d}
.seg.buy button.on[data-v=sell]{background:var(--dn);border-color:var(--dn);color:#1a0505}
.lb{display:grid;gap:8px}
.lrow{position:relative;display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--card);border:1px solid var(--line);overflow:hidden}
.lrow.me{border-color:rgba(34,192,106,.5)}
.lrow .rk{font-weight:900;color:var(--mut);text-align:center}
.lrow:first-child .rk{color:var(--acc)}
.lrow .nm{font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lrow .sub{font-size:12px;color:var(--mut)}
.lrow .pv{text-align:right}
.lrow .pv b{display:block;font-size:16px}
.bench{opacity:.9;border-style:dashed}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.kpi small{display:block;color:var(--mut);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.kpi b{font-size:16px}
.pos{display:grid;grid-template-columns:1.1fr .7fr 1fr 1fr;gap:6px;padding:10px 0;border-top:1px solid var(--line);align-items:center;font-size:13.5px}
.pos:first-of-type{border-top:0}
.pos.h{color:var(--mut);font-size:11px;letter-spacing:.06em;text-transform:uppercase;border-top:0;padding-bottom:4px}
.pos .r{text-align:right}
.tabbar{position:fixed;left:0;right:0;bottom:0;background:rgba(11,15,20,.94);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 10px calc(6px + var(--safe-b));display:flex;justify-content:center;gap:6px;z-index:20}
.tabbar .in-bar{display:flex;gap:6px;width:100%;max-width:560px}
.tabbar button{flex:1;min-height:50px;border-radius:12px;color:var(--mut);font-weight:700;font-size:12px;display:grid;place-items:center;gap:0}
.tabbar button span{font-size:18px;line-height:1}
.tabbar button.on{color:var(--acc);background:rgba(34,192,106,.08)}
#sheet-root{position:fixed;inset:0;z-index:40;display:none}
#sheet-root.on{display:block}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.6)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92vh;max-height:92dvh;overflow:auto;background:var(--card);border-top:1px solid var(--line);border-radius:22px 22px 0 0;padding:18px 16px calc(22px + var(--safe-b));max-width:560px;margin:0 auto}
.sheet h2{font-size:20px;margin-bottom:4px}
.grip{width:44px;height:4px;border-radius:4px;background:var(--line);margin:-6px auto 14px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + var(--safe-b));z-index:60;display:grid;gap:8px;width:calc(100% - 32px);max-width:420px;pointer-events:none}
.toast{background:#1d2a3a;border:1px solid var(--line);padding:12px 16px;border-radius:14px;font-weight:600;box-shadow:0 8px 30px rgba(0,0,0,.4);animation:tin .2s ease-out}
.toast.bad{border-color:#6b2e34;background:#2a1519}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.overlay{position:fixed;inset:0;z-index:70;background:rgba(5,8,12,.82);display:grid;place-items:center;text-align:center;padding:30px}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--acc);animation:sp 1s linear infinite;margin:0 auto 14px}
@keyframes sp{to{transform:rotate(360deg)}}
.note{padding:10px 12px;border-radius:12px;background:var(--bg2);border:1px solid var(--line);font-size:13px;color:var(--mut)}
.note.bad{border-color:#6b2e34;color:#ffb3b3;background:#231216}
.note.good{border-color:#245c43;color:#a8f0cd;background:#0f2019}
.fillrow{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:baseline;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px}
.fillrow:first-child{border-top:0}
.tag{font-weight:800;font-size:11px;letter-spacing:.06em;padding:2px 7px;border-radius:6px}
.tag.buy{background:rgba(61,220,151,.14);color:var(--up)}
.tag.sell{background:rgba(255,107,107,.14);color:var(--dn)}
.tag.rej{background:rgba(140,155,176,.14);color:var(--mut)}
.qr{display:grid;place-items:center;background:#fff;border-radius:14px;padding:12px;width:fit-content;margin:12px auto}
.bigcode{font-size:34px;text-align:center;margin:6px 0}
.chart{width:100%;height:auto;display:block}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:12px;color:var(--mut)}
.legend i{display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
.banner{padding:16px;border-radius:var(--r);background:linear-gradient(135deg,rgba(34,192,106,.16),rgba(34,192,106,.03));border:1px solid rgba(34,192,106,.35);margin-bottom:12px}
.banner h2{font-size:20px}
.pre{white-space:pre-wrap;font-size:14px}
.foot{margin:34px 0 0;text-align:center;color:var(--mut);font-size:12px}
.foot a{color:var(--mut)}
.hide{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.mkt{text-align:center;font-size:12.5px;color:var(--mut);margin:2px 0 10px;line-height:1.7}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet-root"></div>
<div id="toast" aria-live="polite"></div>
<script>
