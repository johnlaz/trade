<body>
<div id="app"></div>
<div id="sheet-root"></div>
<div id="toast" aria-live="polite"></div>
<script>
// ══════════════════════════════════════════
//  ENGINE — pure rules + time logic. No DOM, no network. Unit-tested.
// ══════════════════════════════════════════
// <ENGINE>
const TZ = 'America/New_York';
const CLOSE_MIN = 16 * 60;          // 4:00 pm ET: orders placed before this fill at that day's close
const SETTLE_MIN = 16 * 60 + 20;    // host may settle a day 20 minutes after the close

function etParts(ms) {
  const f = new Intl.DateTimeFormat('en-US', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false });
  const o = {};
  f.formatToParts(new Date(ms)).forEach(p => { o[p.type] = p.value; });
  return { key: o.year + '-' + o.month + '-' + o.day, min: (+o.hour % 24) * 60 + (+o.minute) };
}
function dayKey(ms) { return etParts(ms).key; }
function addDays(key, n) { const d = new Date(key + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
function isWeekday(key) { const g = new Date(key + 'T12:00:00Z').getUTCDay(); return g > 0 && g < 6; }
function nextWeekday(key) { let k = addDays(key, 1); while (!isWeekday(k)) k = addDays(k, 1); return k; }
function prevWeekday(key) { let k = addDays(key, -1); while (!isWeekday(k)) k = addDays(k, -1); return k; }
// The trading day whose close an order placed at `ts` fills at (weekday calendar; holidays are skipped at settle time).
function fillDayFor(ts) {
  const p = etParts(ts);
  if (isWeekday(p.key) && p.min < CLOSE_MIN) return p.key;
  return nextWeekday(p.key);
}
// May the close of `day` be settled at `nowMs`?
function canSettle(day, nowMs) {
  const p = etParts(nowMs);
  if (p.key > day) return true;
  return p.key === day && p.min >= SETTLE_MIN;
}

const TICKER_RE = /^[A-Z]{1,5}(-[A-Z]{1,2})?$/;
function normTicker(t) { return String(t || '').trim().toUpperCase().replace(/\./g, '-'); }
function round2(n) { return Math.round(n * 100) / 100; }
function clonePf(pf) {
  const o = { cash: pf.cash, pos: {} };
  for (const t in (pf.pos || {})) o.pos[t] = { q: pf.pos[t].q, c: pf.pos[t].c };
  return o;
}
function equityOf(pf, px) {
  let v = pf.cash;
  for (const t in (pf.pos || {})) {
    const h = pf.pos[t];
    v += h.q * (px && px[t] != null ? px[t] : h.c / h.q);
  }
  return v;
}
function tickerAllowed(t, rules) {
  if (!rules || rules.uni !== 'list') return true;
  return (rules.list || []).includes(t);
}
// Apply one order at a close price. Returns { ok, reason, pf, pl }.
function applyOrder(pf, o, price, rules, eq) {
  const bad = r => ({ ok: false, reason: r });
  const t = normTicker(o.t);
  const q = Number(o.q);
  if (!TICKER_RE.test(t)) return bad('Invalid ticker');
  if (o.s !== 'buy' && o.s !== 'sell') return bad('Side must be buy or sell');
  if (!Number.isInteger(q) || q < 1) return bad('Quantity must be a whole number of at least 1');
  if (!(price > 0)) return bad('No closing price');
  const p = clonePf(pf);
  if (o.s === 'sell') {
    const h = p.pos[t];
    if (!h || h.q < q) return bad('Not enough shares to sell');
    const avg = h.c / h.q;
    h.c -= avg * q; h.q -= q;
    p.cash += q * price;
    if (h.q === 0) delete p.pos[t];
    return { ok: true, pf: p, pl: round2((price - avg) * q) };
  }
  if (!tickerAllowed(t, rules)) return bad('Not on this game’s ticker list');
  const cost = q * price;
  if (cost > p.cash + 1e-6) return bad('Not enough cash');
  const held = p.pos[t];
  if (!held && Object.keys(p.pos).length >= rules.maxPos) return bad('Position limit reached (' + rules.maxPos + ')');
  const newVal = ((held ? held.q : 0) + q) * price;
  if (rules.maxPct > 0 && newVal > eq * rules.maxPct / 100 + 1e-6) return bad('Over the ' + rules.maxPct + '% single-stock limit');
  if (held) { held.q += q; held.c += cost; } else p.pos[t] = { q, c: cost };
  p.cash -= cost;
  return { ok: true, pf: p };
}
// Settle one trading day for everyone.
//   playerIds: ids to process     portfolios: {pid: {cash,pos}}
//   pending:   {pid: [{id,s,t,q,n,ts}]}   rules: {cash,maxPos,maxTr,maxPct,uni,list}
//   closes:    {TICKER: close}    day: 'YYYY-MM-DD'
// Sells run before buys (so a sale frees cash for a buy placed earlier); each group in timestamp order.
// The first `maxTr` orders by timestamp are allowed; any extras are rejected.
function settleDay(playerIds, portfolios, pending, rules, closes, day) {
  const out = { portfolios: {}, fills: [], equity: {} };
  playerIds.forEach(pid => {
    let pf = clonePf(portfolios[pid] || { cash: rules.cash, pos: {} });
    const orders = (pending[pid] || []).slice().sort((a, b) => (a.ts || 0) - (b.ts || 0));
    const allowed = new Set(orders.slice(0, rules.maxTr).map(o => o.id));
    const sells = orders.filter(o => o.s === 'sell'), buys = orders.filter(o => o.s !== 'sell');
    sells.concat(buys).forEach(o => {
      const t = normTicker(o.t);
      const base = { pid, id: o.id, day, s: o.s, t, q: Number(o.q), n: o.n || '' };
      if (!allowed.has(o.id)) { out.fills.push(Object.assign(base, { st: 'rejected', why: 'Daily trade limit (' + rules.maxTr + ')' })); return; }
      const px = closes[t];
      if (!(px > 0)) { out.fills.push(Object.assign(base, { st: 'rejected', why: 'No closing price for ' + t })); return; }
      const r = applyOrder(pf, o, px, rules, equityOf(pf, closes));
      if (!r.ok) { out.fills.push(Object.assign(base, { st: 'rejected', why: r.reason, px })); return; }
      pf = r.pf;
      const f = Object.assign(base, { st: 'filled', px });
      if (r.pl != null) f.pl = r.pl;
      out.fills.push(f);
    });
    out.portfolios[pid] = pf;
    out.equity[pid] = round2(equityOf(pf, closes));
  });
  return out;
}
function retPct(eq, base) { return (eq / base - 1) * 100; }
// </ENGINE>

// ══════════════════════════════════════════
//  HELPERS + MARKET DATA
// ══════════════════════════════════════════
const APP_VERSION = '1.3.1';
const $ = (s, r) => (r || document).querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const lsRaw = k => { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } };
const lsRawSet = (k, v) => { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch (e) {} };
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const money = n => (n < 0 ? '-' : '') + '$' + Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const money0 = n => (n < 0 ? '-' : '') + '$' + Math.abs(Math.round(n)).toLocaleString('en-US');
const pctTxt = n => (n >= 0 ? '+' : '') + n.toFixed(2) + '%';
const dayLabel = k => { try { return new Date(k + 'T12:00:00Z').toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', timeZone: 'UTC' }); } catch (e) { return k; } };
const sleep = ms => new Promise(r => setTimeout(r, ms));

// Large-cap preset for "ticker list" games and the AI watchlist (a convenience list, not an official index).
const LARGE_CAPS = 'AAPL MSFT NVDA AMZN GOOGL META TSLA AVGO BRK-B JPM V UNH XOM LLY MA JNJ PG HD COST MRK ABBV CVX PEP KO WMT BAC CRM NFLX AMD ORCL ADBE TMO MCD CSCO ACN ABT LIN DHR WFC TXN PM DIS VZ NEE INTC INTU AMGN UPS PFE IBM QCOM LOW HON UNP CAT RTX SPGI GE BA AMAT BMY GS MS PLD NOW DE SBUX MDT BLK ISRG LMT AXP GILD MDLZ TJX ADI BKNG ADP CVS CB SYK VRTX REGN C ZTS SO MO USB COP T MMM F GM SPY QQQ DIA IWM'.split(' ');
const AI_WATCH_DEFAULT = 'AAPL MSFT NVDA AMZN GOOGL META TSLA JPM XOM LLY COST NFLX SPY QQQ IWM'.split(' ');

// ── Price fetching: hedged CORS-proxy race (same approach as AXIOM) ──
const PROXIES = [
  { id: 'allorigins', url: u => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u) },
  { id: 'codetabs', url: u => 'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(u) }
];
let proxyStats = lsGet('ta_proxy_stats', {});
const proxyScore = id => { const s = proxyStats[id] || { ok: 0, fail: 0, ms: 0 }; return s.ok - s.fail * 1.5 - (s.ms || 0) / 4000; };
function proxyNote(id, ok, ms) {
  const s = proxyStats[id] || (proxyStats[id] = { ok: 0, fail: 0, ms: 0 });
  if (ok) { s.ok = Math.min(s.ok + 1, 30); s.fail = Math.max(0, s.fail - .5); s.ms = s.ms ? s.ms * .7 + ms * .3 : ms; }
  else { s.fail = Math.min(s.fail + 1, 30); s.ok = Math.max(0, s.ok - 1); }
  lsSet('ta_proxy_stats', proxyStats);
}
function raceAttempts(attempts, stagger) {
  return new Promise((resolve, reject) => {
    let started = 0, failed = 0, done = false, timer = null, lastErr = 'All routes failed';
    const ctrls = [];
    const end = (fn, v) => { if (done) return; done = true; clearTimeout(timer); ctrls.forEach(c => { try { c.abort(); } catch (e) {} }); fn(v); };
    const arm = () => { clearTimeout(timer); if (!done && started < attempts.length) timer = setTimeout(launch, stagger); };
    const launch = () => {
      if (done || started >= attempts.length) return;
      const att = attempts[started++], ctrl = new AbortController();
      ctrls.push(ctrl);
      const t0 = Date.now(), tm = setTimeout(() => ctrl.abort(), 9000);
      att.run(ctrl.signal).then(v => { clearTimeout(tm); proxyNote(att.id, true, Date.now() - t0); end(resolve, v); })
        .catch(e => {
          clearTimeout(tm);
          if (done) return;
          if (e && e.fatal) return end(reject, e);
          if (e && e.name === 'AbortError') e = new Error('Timed out');
          lastErr = (e && e.message) || String(e);
          proxyNote(att.id, false, 0); failed++;
          if (failed >= attempts.length) return end(reject, new Error(lastErr));
          if (started < attempts.length) launch();
        });
      arm();
    };
    launch();
  });
}
async function parseYahoo(r) {
  const txt = await r.text();
  let j = null; try { j = JSON.parse(txt); } catch (e) {}
  if (j && j.chart && j.chart.error && j.chart.error.code) { const e = new Error('No data for that ticker'); e.fatal = true; throw e; }
  if (r.status === 403 || r.status === 429) throw new Error('HTTP ' + r.status + ' (rate limited)');
  if (!r.ok) throw new Error('HTTP ' + r.status);
  if (!txt || txt.trim()[0] === '<') throw new Error('Proxy returned a page, not data');
  if (j === null) throw new Error('Bad JSON');
  return j;
}
function proxyGet(urls) {

      const ma = n => c.length >= n ? c.slice(-n).reduce((a, b) => a + b, 0) / n : null;
      const m50 = ma(50);
      rows.push({ t, L, d1: chg(1), d5: chg(5), d20: chg(20), v50: m50 ? (L / m50 - 1) * 100 : null });
    } catch (e) {} finally { done++; onProg && onProg(done, watch.length); }
  }));
  if (rows.length < 5) throw new Error('Could not load enough market data for the AI (' + rows.length + ' tickers).');
  rows.sort((a, b) => a.t.localeCompare(b.t));
  const f = (v, d) => v == null ? 'n/a' : v.toFixed(d == null ? 1 : d);
  const table = rows.map(x => `${x.t} close ${x.L.toFixed(2)} | 1d ${f(x.d1)}% | 5d ${f(x.d5)}% | 20d ${f(x.d20)}% | vs 50d avg ${f(x.v50)}%`).join('\n');
  const lastClose = {}; rows.forEach(x => { lastClose[x.t] = x.L; });
  const held = Object.keys(pf.pos || {}).map(t => { const h = pf.pos[t]; const L = lastClose[t]; return `${t}: ${h.q} sh, avg cost ${(h.c / h.q).toFixed(2)}${L ? ', last close ' + L.toFixed(2) : ''}`; }).join('\n') || '(none)';
  const hist = [];
  Object.keys(S.G.fills || {}).sort().slice(-5).forEach(d => { const mine = (S.G.fills[d] || {})[pid] || {}; Object.keys(mine).forEach(id => { const x = mine[id]; if (x.st === 'filled') hist.push(`${d} ${x.s} ${x.q} ${x.t} @ ${x.px}`); }); });
  const univ = r.uni === 'list' ? `You may only BUY these tickers: ${(r.list || []).join(', ')}.` : 'You may buy any US-listed stock or ETF, but only the tickers in the market table below have data for you.';
  const sys = 'You are a player in a paper-trading game competing against humans. Goal: finish with the highest portfolio value. ' +
    'Reply with ONLY a JSON object: {"orders":[{"s":"buy"|"sell","t":"TICKER","q":<whole number>,"n":"<reason, max 100 chars>"}],"summary":"<one sentence>"}. ' +
    'Orders fill at the close of the trading day. Use at most the allowed number of orders; fewer (or none) is fine. Never invent prices.';
  const usr = `Trading day: ${day} (orders fill at today's close; you only see data through the previous close).
Rules: long-only, whole shares, max ${r.maxTr} orders today, max ${r.maxPos} different positions${r.maxPct > 0 ? `, no single stock over ${r.maxPct}% of total value` : ''}. ${univ}
Cash: ${pf.cash.toFixed(2)}
Positions:\n${held}
Your recent fills: ${hist.length ? hist.join('; ') : 'none'}
Market table (through previous close):\n${table}`;
  const txt = await groqChat([{ role: 'system', content: sys }, { role: 'user', content: usr }], { json: true, temp: 0.4 });
  const j = parseJsonLoose(txt);
  if (!j || !Array.isArray(j.orders)) throw new Error('The AI answered in a format I could not read.');
  return { orders: j.orders.slice(0, r.maxTr).map((o, i) => ({ id: 'ai_' + day + '_' + pid + '_' + i, s: o.s === 'sell' ? 'sell' : 'buy', t: normTicker(o.t), q: Math.floor(Number(o.q)), n: String(o.n || '').slice(0, 140), ts: i })), summary: String(j.summary || '').slice(0, 200) };
}

// ── settle one trading day ──
async function settleNext() {
  const meta = META();
  if (!isHost() || meta.status !== 'active') return;
  const day = nextSettleDay();
  if (!canSettle(day, Date.now())) throw new Error('The ' + dayLabel(day) + ' close is not final yet. Try after 4:20 pm ET.');
  const r = RULES();
  busy('Loading ' + dayLabel(day) + ' closing prices…');
  try {
    const spy = await getBars('SPY', true);
    const hasDay = closeOn(spy, day) != null;
    if (!hasDay) {
      unbusy();
      if (!confirm('No market data for ' + dayLabel(day) + '. Was the market closed (holiday)?\n\nOK = skip this day. Cancel = try again later.')) return;
      busy('Skipping ' + dayLabel(day) + '…');
      const upd = { 'meta/lastSettled': day };
      if (day >= meta.endDay) upd['meta/status'] = 'ended';
      await W.update(upd); unbusy(); toast(dayLabel(day) + ' skipped (market closed).'); return;
    }
    // gather tickers
    const pids = playerIds();
    const pending = {};
    const need = new Set(['SPY']);
    pids.forEach(p => {
      const cutoff = pendingFor(p).filter(o => fillDayFor(typeof o.ts === 'number' ? o.ts : 0) <= day);
      pending[p] = cutoff.map(o => ({ id: o.id, s: o.s, t: normTicker(o.t), q: o.q, n: o.n, ts: o.ts }));
      Object.keys(((S.G.portfolios[p] || {}).pos) || {}).forEach(t => need.add(t));
      pending[p].forEach(o => need.add(o.t));
    });
    // AI turns
    const aiNotes = {};
    for (const pid of aiIds()) {
      const pf = Object.assign({ cash: r.cash, pos: {} }, S.G.portfolios[pid] || {}); pf.pos = pf.pos || {};
      let watch = lsGet('ta_ai_watch', null) || AI_WATCH_DEFAULT;
      if (r.uni === 'list' && (r.list || []).length) watch = r.list.slice(0, 40);
      watch = Array.from(new Set(watch.concat(Object.keys(pf.pos)))).slice(0, 45);
      busy('AI is studying the market…');
      try {
        const res = await aiOrdersFor(pid, day, pf, watch, (a, b) => busy('AI is studying the market… ' + a + '/' + b));
        pending[pid] = (pending[pid] || []).concat(res.orders);   // AI orders have ts < any human order, so they sort first
        res.orders.forEach(o => need.add(o.t));
        aiNotes[pid] = res.summary;
      } catch (e) {
        unbusy();
        if (!confirm('The AI could not take its turn: ' + e.message + '\n\nOK = settle the day without the AI’s trades. Cancel = stop and fix it first.')) return;
        busy('Settling…');
      }
    }
    // closing prices for everything involved
    const closes = {}; const tl = Array.from(need); let n = 0;
    busy('Loading closing prices… 0/' + tl.length);
    const missingHeld = [];
    await Promise.all(tl.map(async t => {
      try { const d = await getBars(t, t === 'SPY' ? false : false); const c = closeOn(d, day); if (c != null) closes[t] = c; } catch (e) {}
      n++; busy('Loading closing prices… ' + n + '/' + tl.length);
    }));
    pids.forEach(p => Object.keys(((S.G.portfolios[p] || {}).pos) || {}).forEach(t => { if (!(closes[t] > 0) && !missingHeld.includes(t)) missingHeld.push(t); }));
    if (missingHeld.length) { unbusy(); throw new Error('Missing a close for held position(s): ' + missingHeld.join(', ') + '. Check your connection and try again.'); }
    // run the engine
    const pfs = {};
    pids.forEach(p => { const pf = S.G.portfolios[p] || { cash: r.cash, pos: {} }; pfs[p] = { cash: pf.cash, pos: pf.pos || {} }; });
    const out = settleDay(pids, pfs, pending, r, closes, day);
    const upd = {};
    pids.forEach(p => {
      const pf = out.portfolios[p];
      upd['portfolios/' + p] = { cash: round2(pf.cash), pos: Object.keys(pf.pos).length ? Object.fromEntries(Object.entries(pf.pos).map(([t, h]) => [t, { q: h.q, c: round2(h.c) }])) : null };
      upd['equity/' + day + '/' + p] = out.equity[p];
      pendingFor(p).forEach(o => { if (pending[p].some(x => x.id === o.id)) upd['orders/' + p + '/' + o.id] = null; });
    });
    out.fills.forEach(f => {
      const rec = { s: f.s, t: f.t, q: f.q, st: f.st };
      if (f.n) rec.n = f.n; if (f.px != null) rec.px = f.px; if (f.why) rec.why = f.why; if (f.pl != null) rec.pl = f.pl;
      upd['fills/' + day + '/' + f.pid + '/' + f.id] = rec;
    });
    Object.keys(aiNotes).forEach(p => { if (aiNotes[p]) upd['fills/' + day + '/' + p + '/_sum'] = { st: 'note', n: aiNotes[p], s: 'note', t: '', q: 0 }; });
    Object.keys(closes).forEach(t => { if (t !== 'SPY' || true) upd['prices/' + day + '/' + t] = round2(closes[t]); });
    // benchmark: buy-and-hold SPY from the first settled close
    let base = meta.spyBase;
    if (!base) { base = closes.SPY; upd['meta/spyBase'] = base; }
    upd['equity/' + day + '/spy'] = round2(r.cash * closes.SPY / base);
    upd['meta/lastSettled'] = day;
    if (day >= meta.endDay) upd['meta/status'] = 'ended';
    busy('Saving…');
    await W.update(upd);
    unbusy();
    toast(dayLabel(day) + ' settled.' + (day >= meta.endDay ? ' Game over!' : ''));
  } catch (e) { unbusy(); throw e; }
}
async function endGameNow() { await W.set('meta/status', 'ended'); }

// ── end-of-game debrief (AI) ──
async function makeDebrief() {
  const r = RULES(), meta = META();
  const st = standings();
  const lines = st.rows.map((x, i) => `${i + 1}. ${x.name}${x.ai ? ' (AI)' : ''}: ${x.pct.toFixed(2)}%`);
  const trades = [];
  Object.keys(S.G.fills || {}).sort().forEach(d => Object.keys(S.G.fills[d]).forEach(pid => Object.keys(S.G.fills[d][pid]).forEach(id => {
    const x = S.G.fills[d][pid][id]; if (x.st !== 'filled') return;
    trades.push(`${d} ${((S.G.players[pid] || {}).n) || pid}: ${x.s} ${x.q} ${x.t} @ ${x.px}${x.pl != null ? ' (P/L ' + x.pl + ')' : ''}${x.n ? ' — ' + x.n : ''}`);
  })));
  const spyRow = st.spy != null ? `SPY buy-and-hold: ${st.spy.toFixed(2)}%` : '';
  busy('Writing the debrief…');
  try {
    const txt = await groqChat([
      { role: 'system', content: 'You are a friendly trading coach reviewing a paper-trading game among friends. Be specific, concrete and kind. Plain text, no markdown headers, under 280 words. Teach 2-3 transferable lessons (position sizing, cutting losers, diversification, patience vs overtrading, etc.) tied to what actually happened. No investment advice about future picks.' },
      { role: 'user', content: `Game "${meta.name}", ${meta.firstDay} to ${meta.endDay}. Rules: ${r.maxTr} trades/day, ${r.maxPos} positions max.\nFinal standings:\n${lines.join('\n')}\n${spyRow}\nTrades:\n${trades.slice(-80).join('\n') || '(none)'}` }
    ], { temp: 0.6 });
    await W.set('meta/debrief', txt.slice(0, 2500));
  } finally { unbusy(); }
}

// ── standings (used by board, chart and debrief) ──
function standings() {
  const eqAll = S.G.equity || {}; const r = RULES(); const base = r.cash;
  const days = Object.keys(eqAll).filter(d => d !== 'start').sort();
  const last = days.length ? days[days.length - 1] : 'start';
  const rows = playerIds().map(pid => {
    const p = S.G.players[pid];
    const val = ((eqAll[last] || {})[pid]);
    const v = val != null ? val : base;
    const pf = S.G.portfolios[pid];
    return { pid, name: p.n, ai: !!p.ai, model: p.m, color: p.ai ? AI_COLOR : COLORS[(p.c || 0) % COLORS.length], val: v, pct: retPct(v, base), npos: pf && pf.pos ? Object.keys(pf.pos).length : 0, cash: pf ? pf.cash : base };
  }).sort((a, b) => b.val - a.val);
  const sv = (eqAll[last] || {}).spy;
  const series = {};
  playerIds().concat(['spy']).forEach(pid => { series[pid] = [base].concat(days.map(d => ((eqAll[d] || {})[pid]) != null ? eqAll[d][pid] : null)); });
  return { rows, spy: sv != null ? retPct(sv, base) : null, days, last, series };
}

function benchRow(spy) {
  return '<div class="lrow bench"><span class="rk">—</span><div><div class="nm"><span class="dot" style="background:#8c9bb0"></span>SPY buy &amp; hold</div><div class="sub">the market benchmark</div></div><div class="pv num"><b class="' + (spy >= 0 ? 'up' : 'dn') + '">' + pctTxt(spy) + '</b></div></div>';
}
function lineChart(st) {
  const W = 320, H = 150, pl = 34, pr = 8, pt = 8, pb = 18;
  const ids = Object.keys(st.series); const base = RULES().cash;
  let lo = 0, hi = 0;
  ids.forEach(id => st.series[id].forEach(v => { if (v != null) { const p = retPct(v, base); lo = Math.min(lo, p); hi = Math.max(hi, p); } }));
  if (hi - lo < 2) { hi += 1; lo -= 1; }
  const n = st.days.length + 1;
  const X = i => pl + (n === 1 ? 0 : i * (W - pl - pr) / (n - 1));
  const Y = p => pt + (hi - p) * (H - pt - pb) / (hi - lo);
  let s = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Portfolio return by day">';
  [lo, 0, hi].forEach(p => { s += '<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + Y(p) + '" y2="' + Y(p) + '" stroke="' + (p === 0 ? '#3a4a60' : '#1c2735') + '" stroke-width="1"/><text x="' + (pl - 4) + '" y="' + (Y(p) + 3) + '" fill="#8c9bb0" font-size="9" text-anchor="end">' + p.toFixed(1) + '%</text>'; });
  const legend = [];
  ids.forEach(id => {
    const pts = []; st.series[id].forEach((v, i) => { if (v != null) pts.push(X(i).toFixed(1) + ',' + Y(retPct(v, base)).toFixed(1)); });
    const isSpy = id === 'spy'; const pr = S.G.players[id];
    const col = isSpy ? '#8c9bb0' : (pr && pr.ai ? AI_COLOR : COLORS[((pr && pr.c) || 0) % COLORS.length]);
    if (pts.length > 1) s += '<polyline fill="none" stroke="' + col + '" stroke-width="' + (isSpy ? 1.5 : 2.2) + '"' + (isSpy ? ' stroke-dasharray="4 3"' : '') + ' stroke-linejoin="round" stroke-linecap="round" points="' + pts.join(' ') + '"/>';
    legend.push('<span><i style="background:' + col + '"></i>' + (isSpy ? 'SPY' : esc(pr ? pr.n : id)) + '</span>');
  });
  const lastLbl = st.days.length ? dayLabel(st.days[st.days.length - 1]) : '';
  s += '<text x="' + pl + '" y="' + (H - 4) + '" fill="#8c9bb0" font-size="9">Start</text><text x="' + (W - pr) + '" y="' + (H - 4) + '" fill="#8c9bb0" font-size="9" text-anchor="end">' + esc(lastLbl) + '</text></svg>';
  return s + '<div class="legend">' + legend.join('') + '</div>';
}

  if (m.status === 'active') {
    const qs = playerIds().filter(pid => !(S.G.players[pid] || {}).ai).map(pid => ({ pid, list: pendingFor(pid) })).filter(x => x.list.length);
    h += '<div class="sec">Queued orders (fill at the next close)</div><div class="card">' + (qs.length ? qs.map(x => '<div style="padding:6px 0"><b>' + esc(S.G.players[x.pid].n) + '</b>' + x.list.map(o => '<div class="small"><span class="tag ' + o.s + '">' + o.s.toUpperCase() + '</span> ' + o.q + ' ' + esc(o.t) + (o.n ? ' <span class="mut">“' + esc(o.n) + '”</span>' : '') + '</div>').join('') + '</div>').join('') + '<div class="mut small" style="margin-top:6px">Only you can see these. The AI player decides at settle time, so it never shows here.</div>' : '<div class="mut small">Nothing queued yet. Imported trade cards and players\' orders appear here.</div>') + '</div>';
  }
  h += '<div class="sec">AI player</div><div class="card small"><div class="mut">' + (aiIds().length ? 'The AI takes its turn automatically when you settle each day. It sees the same prices as everyone else and obeys the same limits.' : 'No AI in this game.') + '</div><div style="margin-top:8px">Model: <b>' + esc(groqModel()) + '</b> · key ' + (groqKey() ? '<span class="up">saved</span>' : '<span class="dn">missing</span>') + '</div><button class="btn sm" style="margin-top:10px" data-act="settings">AI settings</button></div>';
  h += '<div class="sec">Backup</div><div class="card"><button class="btn sm" data-act="backup">Download backup (JSON)</button></div>';
  h += '<div class="sec">Danger zone</div><div class="card stack">' + (m.status === 'active' ? '<button class="btn danger block" data-act="endNow">End game now</button>' : '') + '<button class="btn danger block" data-act="deleteGame">Delete game</button></div>';
  return h;
}

// ── Trade sheet ──
function openTrade(prefill) {
  const m = META(), r = RULES(), me = ME(); const fd = fillDayFor(Date.now());
  let cur = { side: 'buy', d: null };
  openSheet('<h2>New trade</h2><div class="mut small">Fills at the <b>' + dayLabel(fd) + '</b> close.</div>' +
    '<label class="f">TICKER</label><div class="row"><input class="in code" id="t-tk" maxlength="6" autocapitalize="characters" autocomplete="off" spellcheck="false" placeholder="AAPL" style="flex:1;text-transform:uppercase;letter-spacing:.1em" value="' + esc(prefill || '') + '"><button class="btn" data-act="lookup">Look up</button></div>' +
    '<div id="t-info" class="small mut" style="margin-top:8px;min-height:20px"></div>' +
    '<label class="f">SIDE</label><div class="seg buy" id="t-side"><button type="button" data-act="side" data-v="buy" class="on">Buy</button><button type="button" data-act="side" data-v="sell">Sell</button></div>' +
    '<label class="f">SHARES</label><div class="row"><input class="in num" id="t-q" type="number" inputmode="numeric" min="1" step="1" placeholder="0" style="flex:1"><button class="btn sm" data-act="maxQty">Max</button></div>' +
    '<div id="t-est" class="small mut" style="margin-top:8px;min-height:20px"></div>' +
    '<label class="f">WHY? (OPTIONAL — EVERYONE SEES IT AFTER THE CLOSE)</label><input class="in" id="t-n" maxlength="100" placeholder="e.g. strong earnings, buying the dip…">' +
    '<div id="t-msg" style="margin-top:12px"></div>' +
    '<button class="btn primary block" style="margin-top:12px" data-act="placeOrder">Place order</button>', sh => {
    const tk = $('#t-tk', sh), q = $('#t-q', sh);
    const upd = () => tradeEstimate();
    tk.addEventListener('input', () => { cur.d = null; $('#t-info').textContent = ''; $('#t-est').textContent = ''; });
    tk.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); doLookup(); } });
    q.addEventListener('input', upd);
    if (prefill) doLookup();
  });
}
let TR = { d: null, side: 'buy' };
async function doLookup() {
  const el = $('#t-info'); const tk = normTicker($('#t-tk').value);
  el.className = 'small mut'; el.textContent = 'Looking up ' + tk + '…';
  try {
    const d = await lookupTicker(tk);
    const r = RULES();
    TR.d = d; $('#t-tk').value = d.t;
    el.innerHTML = '<b>' + esc(d.name) + '</b> · last ' + money(d.last) + ' <span class="mut">(delayed)</span>' + (r.uni === 'list' && !tickerAllowed(d.t, r) ? '<div class="dn">Not on this game’s ticker list (you can still sell it).</div>' : '');
    tradeEstimate();
  } catch (e) { TR.d = null; el.className = 'small dn'; el.textContent = e.message; }
}
function tradeEstimate() {
  const est = $('#t-est'); if (!est) return;
  const q = Math.floor(Number($('#t-q').value) || 0);
  if (!TR.d || !q) { est.textContent = ''; return; }
  est.innerHTML = '≈ <b>' + money(q * TR.d.last) + '</b> at the last price. Actual fill is the closing price.';
}
function myHeld(t) { const p = myPortfolio().pos[t]; return p ? p.q : 0; }
function queuedFor(t, side) { return pendingFor(ME()).filter(o => o.t === t && o.s === side).reduce((a, o) => a + o.q, 0); }
function maxQty() {
  if (!TR.d) return 0; const r = RULES(), pf = myPortfolio(); const px = TR.d.last;
  if (TR.side === 'sell') return Math.max(0, myHeld(TR.d.t) - queuedFor(TR.d.t, 'sell'));
  const est = pendingEst(); let cash = pf.cash;
  pendingFor(ME()).forEach(o => { const p = est[o.t]; if (!p) return; cash += o.s === 'sell' ? o.q * p : -o.q * p; });
  let q = Math.floor(Math.max(0, cash) / px);
  if (r.maxPct > 0) { const eq = equityOf(pf, est); const cap = Math.floor(eq * r.maxPct / 100 / px) - myHeld(TR.d.t) - queuedFor(TR.d.t, 'buy'); q = Math.min(q, Math.max(0, cap)); }
  return q;
}
function checkClient(o) {
  const r = RULES(), pf = myPortfolio(), me = ME(); const pend = pendingFor(me); const est = pendingEst();
  const fd = fillDayFor(Date.now());
  const used = pend.filter(x => fillDayFor(typeof x.ts === 'number' ? x.ts : Date.now()) === fd).length;
  if (used >= r.maxTr) return 'You’ve used all ' + r.maxTr + ' trades for the ' + dayLabel(fd) + ' close.';
  if (o.s === 'sell') { if (o.q > myHeld(o.t) - queuedFor(o.t, 'sell')) return 'You only have ' + Math.max(0, myHeld(o.t) - queuedFor(o.t, 'sell')) + ' shares of ' + o.t + ' available to sell.'; return ''; }
  if (!tickerAllowed(o.t, r)) return o.t + ' is not on this game’s ticker list.';
  const held = Object.keys(pf.pos); const newNames = new Set(pend.filter(x => x.s === 'buy' && !pf.pos[x.t]).map(x => x.t));
  if (!pf.pos[o.t] && !newNames.has(o.t) && held.length + newNames.size >= r.maxPos) return 'Position limit reached (' + r.maxPos + '). Sell something first.';
  let cash = pf.cash; pend.forEach(x => { const p = est[x.t]; if (p) cash += x.s === 'sell' ? x.q * p : -x.q * p; });
  if (o.q * TR.d.last > cash + 0.5) return 'Not enough cash (about ' + money(Math.max(0, cash)) + ' available after queued orders).';
  if (r.maxPct > 0) { const eq = equityOf(pf, est); const tot = (myHeld(o.t) + queuedFor(o.t, 'buy') + o.q) * TR.d.last; if (tot > eq * r.maxPct / 100 + 0.5) return 'That would put you over the ' + r.maxPct + '% single-stock limit.'; }
  return '';
}
async function placeOrder() {
  const msg = $('#t-msg'); msg.innerHTML = '';
  if (!TR.d) { await doLookup(); if (!TR.d) return; }
  const q = Math.floor(Number($('#t-q').value) || 0);
  if (q < 1) { msg.innerHTML = '<div class="note bad">Enter a whole number of shares.</div>'; return; }
  const o = { s: TR.side, t: TR.d.t, q, n: ($('#t-n').value || '').trim().slice(0, 100) };
  const err = checkClient(o);
  if (err) { msg.innerHTML = '<div class="note bad">' + esc(err) + '</div>'; return; }
  const ord = { s: o.s, t: o.t, q: o.q, n: o.n, ts: NOW() }; if (TR.d && TR.d.last > 0) ord.p = Math.round(TR.d.last * 100) / 100;
  await W.set('orders/' + ME() + '/' + newId(), ord);
  closeSheet(); toast((o.s === 'buy' ? 'Buy ' : 'Sell ') + o.q + ' ' + o.t + ' queued'); S.tab = 'trade'; sched();
}

// ── trade card sheet (player → host, for offline play) ──
function openCardSheet() {
  const card = buildCard(); const json = JSON.stringify(card);
  const fname = 'trade-card-' + card.game + '-' + card.name.replace(/[^a-z0-9]+/gi, '').slice(0, 12) + '.json';
  openSheet('<h2>Trade card</h2><div class="mut small">Send your queued orders to the host as a file. Online players don’t need this — their orders already sync.</div>' +
    '<div class="card" style="margin-top:12px">' + card.orders.map(o => '<div class="fillrow"><span class="tag ' + o.s + '">' + o.s.toUpperCase() + '</span><span><b>' + o.q + ' ' + esc(o.t) + '</b></span><span></span></div>').join('') + '</div>' +
    '<div class="stack" style="margin-top:14px"><button class="btn primary block" data-act="shareCard">Share file…</button><button class="btn block" data-act="emailCard">Email it</button><button class="btn block" data-act="copyCard">Copy JSON</button></div>', () => { window._card = { card, json, fname }; });
}
function openImportCard() {
  openSheet('<h2>Import trade card</h2><div class="mut small">Load the file a player sent you, or paste its contents.</div>' +
    '<input type="file" id="ic-file" accept=".json,application/json" class="in" style="margin-top:12px;padding-top:12px"><textarea class="in" id="ic-text" style="margin-top:8px" placeholder="…or paste the card JSON here"></textarea>' +
    '<label class="f">PLAYER</label><select class="in" id="ic-pid">' + humanIds().map(p => '<option value="' + esc(p) + '">' + esc(S.G.players[p].n) + '</option>').join('') + '</select>' +
    '<div id="ic-msg" style="margin-top:12px"></div><button class="btn primary block" style="margin-top:12px" data-act="doImportCard">Import orders</button>', sh => {
    const fi = $('#ic-file', sh);
    fi.addEventListener('change', async () => { const f = fi.files[0]; if (f) { $('#ic-text').value = await f.text(); autoPickCard(); } });
    $('#ic-text', sh).addEventListener('input', autoPickCard);
  });
}
function autoPickCard() { try { const c = JSON.parse($('#ic-text').value); if (c && c.pid && S.G.players[c.pid]) $('#ic-pid').value = c.pid; } catch (e) {} }

// Anyone can open a player's holdings (as of the last settled close). Pending orders stay private.
function openPlayerSheet(pid) {
  const p = S.G.players[pid]; if (!p) return;
  const pf = S.G.portfolios[pid] || { cash: RULES().cash, pos: null }; const pos = pf.pos || {}; const px = lastPrices();
  const rows = Object.keys(pos).map(t => { const q = pos[t].q, c = pos[t].c, L = px[t] != null ? px[t] : c / q; return { t, q, c, L, v: q * L }; }).sort((a, b) => b.v - a.v);
  const inv = rows.reduce((a, x) => a + x.v, 0), tot = inv + pf.cash;
  openSheet('<h2>' + esc(p.n) + (p.ai ? ' <span class="chip ai">AI</span>' : '') + '</h2><div class="mut small">Holdings as of the last settled close</div>' +
    '<div class="kpis" style="margin-top:12px"><div class="kpi"><small>Total</small><b class="num">' + money0(tot) + '</b></div><div class="kpi"><small>Cash</small><b class="num">' + money0(pf.cash) + '</b></div><div class="kpi"><small>Invested</small><b class="num">' + (tot ? Math.round(inv / tot * 100) : 0) + '%</b></div></div>' +
    '<div class="card" style="margin-top:12px">' + (rows.length ? rows.map(x => { const pl = x.v - x.c; return '<div class="row sp" style="padding:7px 0"><span><b>' + esc(x.t) + '</b> <span class="mut small">' + x.q + ' sh @ ' + money(x.c / x.q) + ' avg</span></span><span class="num" style="text-align:right">' + money0(x.v) + '<div class="small ' + (pl >= 0 ? 'up' : 'dn') + '">' + (pl >= 0 ? '+' : '') + money0(pl) + ' (' + pctTxt(retPct(x.v, x.c)) + ')</div></span></div>'; }).join('') : '<div class="mut small">All cash, no positions.</div>') + '</div>');
}

// ── live prices for the Trade tab (positions + queued tickers), refreshed while it is open ──
function liveOf(t) { const c = barCache[t]; return c && c.data && c.data.last > 0 ? c.data.last : null; }
let liveBusy = false;
async function liveRefresh() {
  if (liveBusy || S.view !== 'game' || S.tab !== 'trade' || document.hidden) return;
  const m = META(); if (!m || m.status !== 'active' || !S.G.players[ME()]) return;
  const ts = new Set(Object.keys(myPortfolio().pos)); pendingFor(ME()).forEach(o => ts.add(o.t));
  if (!ts.size) return;
  liveBusy = true;
  try {
    const before = JSON.stringify([...ts].map(liveOf));
    await Promise.all([...ts].map(t => getBars(t).catch(() => null)));
    if (JSON.stringify([...ts].map(liveOf)) !== before && S.tab === 'trade' && !$('#sheet-root.on')) sched();
  } finally { liveBusy = false; }
}
setInterval(liveRefresh, 60000);

// ══════════════════════════════════════════
//  ACTIONS — every data-act button lands here
// ══════════════════════════════════════════
const ACT = {
  home() { leaveGame(); S.view = 'home'; sched(); },
  settings() { openSettings(); },
  closeSheet() { closeSheet(); },
  tab(el) { S.tab = el.dataset.v; sched(); window.scrollTo(0, 0); liveRefresh(); },
  newGame() { S.view = 'create'; sched(); },
  joinSheet() { openJoin(); },
  openGame(el) { const g = gamesList()[+el.dataset.i]; if (g) guard(() => openGame(g)); },
  copyCode() { copyText(S.game.code); },
  copyLink() { copyText(joinLink(S.game.code)); },
  shareLink() {
    const url = joinLink(S.game.code);
    if (navigator.share) navigator.share({ title: 'Trade Arena', text: 'Join my paper-trading game: ' + S.game.code, url }).catch(() => {}); else copyText(url);
  },
  forgetGame() { removeGameEntry(S.game.code); leaveGame(); },

  // create form
  cashChip(el) { $('#c-cash').value = el.dataset.v; },
  durChip(el) { CF.dur = +el.dataset.v; $('#c-dur').querySelectorAll('button').forEach(b => b.classList.toggle('on', b === el)); $('#c-end').classList.toggle('hide', CF.dur !== 0); },
  uniChip(el) { CF.uni = el.dataset.v; $('#c-uni').querySelectorAll('button').forEach(b => b.classList.toggle('on', b === el)); $('#c-list-wrap').classList.toggle('hide', CF.uni !== 'list'); },
  fillCaps() { $('#c-list').value = LARGE_CAPS.join(' '); },
  doCreate() {
    guard(async () => {
      const o = readCreate(); lsRawSet('ta_me', o.myName);
      if (o.online && !fbConfig()) throw new Error('Firebase is not set up. Turn off online play or add your config in Settings.');
      CF.name = o.name;
      await createGame(o);
      if (o.ai) await addAiPlayer();
      S.tab = 'board';
    });
  },

  // settings
  saveFb() {
    const raw = ($('#s-fb').value || '').trim(); if (!raw) return toast('Paste your config first', 'bad');
    try {
      let txt = raw.replace(/^[^{]*\{/, '{').replace(/\}[^}]*$/, '}');           // accept "const firebaseConfig = {...};"
      txt = txt.replace(/([{,]\s*)([A-Za-z_]\w*)\s*:/g, '$1"$2":').replace(/'/g, '"').replace(/,\s*\}/g, '}');
      const c = JSON.parse(txt);
      if (!c.apiKey || !c.databaseURL) throw new Error('The config needs apiKey and databaseURL. Is Realtime Database created?');
      lsSet('ta_fb_config', c); toast('Saved. Reloading…'); setTimeout(() => location.reload(), 700);
    } catch (e) { toast('Could not read that config: ' + e.message, 'bad'); }
  },
  clearFb() { lsRawSet('ta_fb_config', ''); toast('Cleared. Reloading…'); setTimeout(() => location.reload(), 600); },
  saveKey() {
    const v = ($('#s-key').value || '').trim(); if (!v) return toast('Paste a key first', 'bad');
    lsRawSet('ta_groq_key', v); lsRawSet('ta_groq_model', ''); lsRawSet('ta_groq_models', '');
    toast('Key saved. Loading models…'); refreshGroqModels().then(() => { openSettings(); });
  },
  clearKey() { ['ta_groq_key', 'ta_groq_model', 'ta_groq_models'].forEach(k => lsRawSet(k, '')); openSettings(); },
  refreshModels() { refreshGroqModels().then(() => openSettings()); },
  saveWatch() {
    const l = Array.from(new Set(($('#s-watch').value || '').toUpperCase().split(/[\s,;]+/).map(normTicker).filter(t => TICKER_RE.test(t)))).slice(0, 45);
    if (l.length < 5) return toast('Keep at least 5 tickers', 'bad'); lsSet('ta_ai_watch', l); toast('Watchlist saved (' + l.length + ')');
  },
  saveProxy() { const v = ($('#s-proxy').value || '').trim(); if (v && !cleanProxyUrl(v)) return toast('Proxy must be an https:// URL', 'bad'); lsRawSet('ta_proxy', v); toast('Saved'); },

  // join
  doJoin() {
    guard(async () => {
      const name = ($('#j-name').value || '').trim(); lsRawSet('ta_me', name);
      await joinOnline($('#j-code').value, name); closeSheet();
    });
  },
  doLoadFile() {
    guard(async () => {
      const obj = window._gf; const me = $('#j-me').value;
      const r = importGameFile(obj, me);
      const entry = { code: r.code, role: 'player', mode: 'local', me: r.me || me, name: obj.G.meta.name };
      saveGameEntry(entry); closeSheet(); await openGame(entry); toast('Game loaded');
    });
  },

  // lobby / host
  startGame() { if (confirm('Start the game now? No one can join after this.')) guard(startGame, 'Game started — good luck!'); },
  addAi() { guard(async () => { if (!groqKey()) throw new Error('Add a Groq key in Settings first.'); await addAiPlayer(); }); },
  addOffline() {
    openSheet('<h2>Add a player</h2><div class="mut small">For someone who will play offline, or who hasn’t got the app.</div><label class="f">NAME</label><input class="in" id="ao-name" maxlength="20"><button class="btn primary block" style="margin-top:14px" data-act="doAddOffline">Add</button>');
  },
  doAddOffline() {
    guard(async () => {
      const n = ($('#ao-name').value || '').trim(); if (!n) throw new Error('Enter a name.');
      await W.set('players/o' + newId(), { n, c: playerIds().length % COLORS.length, t: NOW() }); closeSheet();
    });
  },
  removePlayer(el) { if (confirm('Remove this player?')) guard(async () => { await W.set('players/' + el.dataset.id, null); }); },
  settle() { guard(settleNext); },
  debrief() { guard(makeDebrief, 'Debrief ready'); },
  endNow() { if (confirm('End the game now? Standings freeze at the last settled close.')) guard(endGameNow, 'Game ended'); },
  deleteGame() {
    if (!confirm('Delete this game for everyone? This cannot be undone.')) return;
    guard(async () => {
      if (S.game.mode === 'fb') await S.ref.remove();
      removeGameEntry(S.game.code); leaveGame();
    });
  },
  backup() { downloadJson('trade-arena-backup-' + S.game.code + '.json', { ta: 1, type: 'backup', exported: Date.now(), G: S.G }); },
  exportGame() { shareJson('trade-arena-game-' + S.game.code + '.json', gameFile(), 'Trade Arena game ' + S.game.code); },
  importCardSheet() { openImportCard(); },
  doImportCard() {
    guard(async () => {
      let c; try { c = JSON.parse($('#ic-text').value); } catch (e) { throw new Error('That isn’t valid JSON.'); }
      const r = await importCard(c, $('#ic-pid').value); closeSheet();
      toast('Imported ' + r.added + ' order' + (r.added === 1 ? '' : 's') + (r.skipped ? ' (' + r.skipped + ' skipped)' : ''));
    });
  },

  // trading
  newTrade() { TR = { d: null, side: 'buy' }; openTrade(); },
  lookup() { doLookup(); },
  side(el) { TR.side = el.dataset.v; $('#t-side').querySelectorAll('button').forEach(b => b.classList.toggle('on', b === el)); },
  maxQty() { if (!TR.d) return toast('Look up a ticker first', 'bad'); $('#t-q').value = maxQty() || ''; tradeEstimate(); },
  placeOrder() { guard(placeOrder); },
  cancelOrder(el) { guard(async () => { await W.set('orders/' + ME() + '/' + el.dataset.id, null); }, 'Order cancelled'); },
  viewPlayer(el) { openPlayerSheet(el.dataset.id); },
  cardSheet() { openCardSheet(); },
  shareCard() { const c = window._card; shareJson(c.fname, c.card, 'Trade card'); },
  emailCard() {
    const c = window._card; const to = 'lazlab.io@gmail.com';
    location.href = 'mailto:' + to + '?subject=' + encodeURIComponent('Trade card ' + c.card.game + ' — ' + c.card.name) + '&body=' + encodeURIComponent('Paste this into Host → Import trade card:\n\n' + c.json);
  },
  copyCard() { copyText(window._card.json); }
};
function downloadJson(name, obj) {
  const blob = new Blob([JSON.stringify(obj, null, 1)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
async function shareJson(name, obj, title) {
  const json = JSON.stringify(obj);
  try {
    const file = new File([json], name, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title }); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  downloadJson(name, obj); toast('Saved as a file — attach it to a message or email.');
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = ACT[el.dataset.act]; if (!fn) return;
  if (el.tagName === 'A') e.preventDefault();
  fn(el, e);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

// ── boot ──
(function boot() {
  render();
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
  const p = new URLSearchParams(location.search).get('join');
  if (p) { history.replaceState(null, '', location.pathname); openJoin(p.toUpperCase().slice(0, 6)); }
  if (groqKey()) { const c = groqCache(); if (!c || Date.now() - c.at > GROQ_STALE_MS) refreshGroqModels(true); }
  if (fbConfig()) fbInit().catch(() => {});
})();

</script>
