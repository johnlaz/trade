<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" role="img" aria-labelledby="t d">
  <title id="t">Trade Arena</title>
  <desc id="d">Trade Arena: a paper-trading game. Same cash, same rules, best trader wins. Rising green bars with a trend line.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0F1824"/><stop offset="1" stop-color="#080C12"/></linearGradient>
    <linearGradient id="g1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#34E282"/><stop offset="1" stop-color="#1A7A4A"/></linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <rect width="1280" height="320" rx="20" fill="url(#bg)"/>
  <rect x="1" y="1" width="1278" height="318" rx="19" fill="none" stroke="#223043" stroke-width="2"/>
  <g font-family="'Arial Narrow','Helvetica Neue',Arial,Helvetica,sans-serif">
    <text x="72" y="150" font-size="104" font-weight="800" fill="#E9EFF7" letter-spacing="-2">Trade <tspan fill="#22C06A">Arena</tspan></text>
    <text x="76" y="204" font-size="30" fill="#A9B7CB">Same cash. Same rules. Best trader wins.</text>
    <g font-size="20" font-weight="700" fill="#E9EFF7">
      <rect x="76" y="236" width="196" height="40" rx="20" fill="#131B26" stroke="#223043"/><text x="174" y="263" text-anchor="middle">You + friends</text>
      <rect x="284" y="236" width="150" height="40" rx="20" fill="#131B26" stroke="#223043"/><text x="359" y="263" text-anchor="middle">An AI rival</text>
      <rect x="446" y="236" width="210" height="40" rx="20" fill="#131B26" stroke="#223043"/><text x="551" y="263" text-anchor="middle">Paper money only</text>
    </g>
  </g>
  <g transform="translate(860 40)">
    <rect x="0" y="170" width="84" height="70" rx="12" fill="#1A7A4A"/>
    <rect x="120" y="120" width="84" height="120" rx="12" fill="#1FA862"/>
    <rect x="240" y="50" width="84" height="190" rx="12" fill="url(#g1)"/>
    <rect x="-16" y="254" width="356" height="10" rx="5" fill="#223043"/>
    <polyline points="42,150 162,100 282,30" fill="none" stroke="#34E282" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" opacity=".8"/>
    <polyline points="42,150 162,100 282,30" fill="none" stroke="#ECFFF4" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="42" cy="150" r="8" fill="#ECFFF4"/><circle cx="162" cy="100" r="8" fill="#ECFFF4"/>
    <circle cx="282" cy="30" r="16" fill="#34E282" stroke="#ECFFF4" stroke-width="5"/>
  </g>
</svg>
